*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl;

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3vw,2rem);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.search{position:relative;flex:0 1 320px;min-width:0}
.search input{width:100%;font:inherit;padding:10px 40px 10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip svg{width:16px;height:16px;color:var(--accent)}
.grid{columns:3 320px;column-gap:16px}
.card{break-inside:avoid;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-margin-top:16px}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.icon{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.icon svg{width:26px;height:26px}
.card-head h2{font-family:var(--display);font-weight:500;font-size:1.12rem;margin:0;line-height:1.25}
.count{color:var(--muted);font-size:.88rem}
.folder{margin-inline-start:auto;font-size:.85rem;color:var(--muted);text-decoration:none;white-space:nowrap}
.folder:hover{color:var(--accent);text-decoration:underline}
ul{list-style:none;margin:0;padding:6px 0}
.group{font-size:.82rem;font-weight:700;letter-spacing:.02em;color:var(--green);background:var(--green-soft);padding:4px 16px;margin-top:6px}
li.file{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 16px}
li.file+li.file{border-top:1px dashed var(--line)}
.num{min-width:26px;height:26px;border-radius:8px;background:var(--bg);color:var(--muted);font-size:.85rem;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.name{min-width:0}
.name a{color:var(--fg);text-decoration:none;font-weight:600}
.name a:hover{color:var(--accent);text-decoration:underline}
.size{display:block;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.dl{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:.88rem;padding:6px 12px;border-radius:999px;white-space:nowrap}
.dl:hover{filter:brightness(1.07)}
.dl:focus-visible,.name a:focus-visible,.folder:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dl svg{width:16px;height:16px}
.empty{color:var(--muted);text-align:center;padding:24px}
.note{color:var(--muted);font-size:.88rem}
@media (max-width:480px){.dl span{display:none}.dl{padding:7px}}
</style>

      if(gr.name)rows+=`<li class="group">${esc(gr.name)}</li>`;
      fs.forEach(([name,id,size])=>{n++;const [num,label]=split(name);
        rows+=`<li class="file"><span class="num">${num||'&#8226;'}</span><span class="name"><a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">${esc(label)}</a><span class="size">PDF · ${mb(size)}</span></span><a class="dl" href="https://drive.google.com/uc?export=download&amp;id=${id}" target="_blank" rel="noopener" aria-label="הורדת ${esc(label)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${DL}</svg><span>הורדה</span></a></li>`;});
    });
    if(!n)return;shown++;
    html+=`<section class="card" id="t${ti}"><div class="card-head"><span class="icon">${svg(tp.i)}</span><div><h2>${esc(tp.t)}</h2><span class="count">${n} מצגות</span></div><a class="folder" href="${F}${tp.f}" target="_blank" rel="noopener">כל התיקייה</a></div><ul>${rows}</ul></section>`;
  });
  document.getElementById('grid').innerHTML=html;
  document.getElementById('empty').hidden=shown>0;
}
document.getElementById('chips').innerHTML=T.map((tp,ti)=>`<button class="chip" type="button" data-t="t${ti}">${svg(tp.i,2)}${esc(tp.t)}</button>`).join('');
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
  const q=document.getElementById('q');if(q.value){q.value='';render('')}
  const el=document.getElementById(b.dataset.t);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
render('');
</script>
</body>
</html>
